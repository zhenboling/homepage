<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="https://icon-icons.com/icons2/2249/PNG/512/alpha_z_circle_outline_icon_139973.png" type="image/x-icon">

  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h3 {
      color: #ffffff;
    }

    input {
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #333;
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      width: 250px;
    }

    input:focus {
      outline: none;
      border-color: #4dabf7;
    }

    button {
      background-color: #2c2c2c;
      color: #ffffff;
      border: 1px solid #444;
      padding: 8px 12px;
      margin: 5px 5px 5px 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3a3a3a;
    }

    p {
      color: #bdbdbd;
    }

    hr, p.separator {
      border: none;
      border-top: 1px solid #333;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<h3>Superflurry event converter</h3>

<input type="text" id="ios_input" onfocus="this.value=''">
<button onclick="iosConvert()">Convert iOS</button>
<p id="ios_output"></p>

<script>
function iosConvert() {
  var x = document.getElementById("ios_input").value;
  var y = x.substring(x.length - 13).replace("_", "-");
  document.getElementById("ios_output").innerHTML = y;
  navigator.clipboard.writeText(y);
}
</script>

<input type="text" id="android_input" onfocus="this.value=''">
<button onclick="androidConvert()">Convert Android</button>
<p id="android_output"></p>

<script>
function androidConvert() {
  var x = document.getElementById("android_input").value;
  var y = x.toLowerCase().substring(x.length - 13).replace("_", "-");
  document.getElementById("android_output").innerHTML = y;
  navigator.clipboard.writeText(y);
}
</script>

<hr>

<h3>UEOv3 Web</h3>

<input type="text" id="merchant_uuid" onfocus="this.value=''">
<button onclick="createUEOv3()">Get Link</button>
<p id="UEOv3_output"></p>

<script>
function createUEOv3() {
  var x = document.getElementById("merchant_uuid").value;
  var y = "https://eats-orders.uberinternal.com/?userUuid=" + x;
  document.getElementById("UEOv3_output").innerHTML = y;
  navigator.clipboard.writeText(y);
}
</script>
