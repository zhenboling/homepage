        function getFaviconUrl(domain, name) {
          switch (name.toLowerCase()) {
            case '33mail':
              return 'https://33mail.com/favicon.ico';
            case 'anonaddy':
              return 'https://app.addy.io/favicon.ico';
            case 'bananacard':

            case 'chatgpt':

            case 'flights':

            case 'king county':
              return 'https://kingcounty.gov/favicon.ico';
            case 'maps':

            case 'outlook':

            case 'rednote':
              return 'https://fe-video-qc.xhscdn.com/fe-platform/ed8fe781ce9e16c1bfac2cd962f0721edabe2e49.ico';
            case 'shareworks':
              return 'https://shareworks.solium.com/favicon.ico';
            default:
              return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
          }
        }
